# set to false on a display with no Stream Deck attached
stream_deck: true
# optional: a speaker with a line-in (Front Room, Kitchen, Move 2, Office); the favorites screen then starts with
# a tile that plays it (named and pictured by display.line_in_track_name / line_in_track_image)
# line_in_device: "Front Room"
target_devices:
  - name: Kitchen
    required: true
    main: true
  - name: Front Room
    required: true
  - name: "Family Room (TV)"
    required: false


display:
  screen_size: 720
  fallback_font_size: 24
  background_image: "assets/background01.png"
  background_horizon_y: 538     # where the image's horizon falls on screen; it's shifted to sit at the art's bottom
  text_color: [255, 255, 255]
  text_shadow_color: [0, 0, 0]
  text_shadow_offset: [2, 2]
  line_in_track_image: "assets/lineIn02.png"
  line_in_track_name: "Record Player"


layout:
  # the title sits across the widest part of the circle, under the art; the largest of track_font_sizes it fits
  # in (two lines, uncut) is used, else track_font_size with the text cut short
  track_font_size: 42
  track_font_sizes: [64, 58, 52, 46]
  track_text_color: [255,255,255]
  track_text_alpha: 255
  track_font_asset: "assets/PublicSans-Bold.ttf"
  track_text_y: 408
  track_text_width: 640
  track_text_shadow: true
  track_strip_parens: true
  track_line_space: -5

  artist_font_size: 36
  artist_font_asset: 'assets/PublicSans-Medium.ttf'
  artist_text_y: 515
  artist_text_width: 580
  artist_text_color: [255,255,255]
  artist_text_alpha: 255
  artist_text_shadow: true
  artist_strip_parens: true

  album_font_size: 22
  album_font_asset: 'assets/PublicSans-MediumItalic.ttf'
  album_text_y: 550
  album_text_width: 540
  album_text_color: [255,255,255]
  album_text_alpha: 160
  album_text_shadow: true
  album_strip_parens: true

  speaker_font_size: 14
  speaker_font_asset: 'assets/PublicSans-Medium.ttf'
  speaker_text_y: 40
  speaker_text_width: 300
  speaker_text_color: [255,255,255]
  speaker_text_alpha: 120
  speaker_text_shadow: true
  speaker_strip_parens: false

  status_font_size: 12
  status_font_asset: 'assets/PublicSans-Medium.ttf'
  status_text_y: 690
  status_text_width: 360
  status_text_color: [255,255,255]
  status_text_alpha: 180
  status_text_shadow: true
  status_strip_parens: false

  # album_art_full_screen: the art fills the circle (cropped by it) in place of the background image.
  # false: a square of album_art_size centred at album_art_y, over the background
  album_art_full_screen: true
  album_art_size: 260
  album_art_y: 192
  # a see-through black band across the screen behind the title, artist and album: [top, bottom]
  text_band_y: [325, 566]
  text_band_alpha: 100
  # the spinner and the favorite being started, on top of everything
  command_feedback_y: 360

  ui_header_font_size: 24
  ui_header_font_asset: 'assets/PublicSans-Bold.ttf'

  # the connecting screen: the room in the spinner, the current step under "Connecting..."
  connecting_room_font_size: 34
  connecting_room_font_asset: 'assets/PublicSans-Bold.ttf'
  connecting_detail_font_size: 20
  connecting_detail_font_asset: 'assets/PublicSans-Medium.ttf'
  connecting_detail_color: [190, 190, 190]

  play_state_y: 586

  # extra tap area around small buttons (art size unchanged)
  button_hit_padding: 20

  # press and hold here (above the song title, around the room name) to get the quit confirm: [x, y, w, h]
  quit_hold_area: [200, 10, 320, 85]
  quit_hold_time: 1.5

  # volume dial (while the volume button is held): turning volume_dial_degrees covers 0 to 100
  volume_dial_degrees: 270
  volume_dial_dead_zone: 60
  volume_dial_radius: 320
  volume_dial_width: 28
  volume_dial_font_size: 120
  volume_dial_font_asset: 'assets/PublicSans-Bold.ttf'
  volume_dial_label_font_size: 22
  volume_dial_label_font_asset: 'assets/PublicSans-Medium.ttf'

  next_button_pos: [560, 177]     # either side of the art
  prev_button_pos: [130, 177]
  next_button_asset: "assets/NextTrackBtn.png"
  prev_button_asset: "assets/PrevTrackBtn.png"
  next_button_size: [30, 30]
  prev_button_size: [30, 30]

  # bottom row, left to right: shuffle, favorites, play/pause, volume, group. pos is the top-left corner;
  # the outer pairs follow the curve of the circle, play sits level with its neighbours
  play_button_pos: [330, 634]
  play_button_asset: "assets/PlayBtn.png"
  play_button_size: [60, 60]
  pause_button_asset: "assets/PauseBtn.png"

  favs_button_pos: [263, 649]
  favs_button_size: [30, 30]
  favs_button_asset: "assets/FavsBtn.png"

  group_button_pos: [503, 618]
  group_button_size: [30, 30]
  group_button_asset: "assets/SpeakerGroup.png"

  # bright when shuffle is on, dim when off; hidden for line-in
  shuffle_button_pos: [188, 618]
  shuffle_button_size: [30, 30]
  shuffle_button_asset: "assets/ShuffleBtn.png"
  shuffle_off_alpha: 90
  shuffle_disabled_alpha: 35     # line-in: nothing to shuffle

  # press and hold for the volume dial
  volume_button_pos: [427, 649]
  volume_button_size: [30, 30]
  volume_button_asset: "assets/VolBtn.png"

  # favorites screen
  favs_slide_time: 0.3
  favs_back_button_pos: [340, 640]
  favs_back_button_size: [40,40]
  favs_back_button_asset: "assets/DownBtn.png"
  favs_refresh_button_pos: [425, 45]
  favs_refresh_button_size: [30, 30]
  favs_refresh_button_asset: "assets/RefreshBtn.png"
  favs_tile_size: 120
  favs_label_font_size: 16
  favs_label_font_asset: 'assets/PublicSans-Medium.ttf'
  # rooms screen (the group button): a row per speaker, filled when grouped with the main room
  rooms_row_size: [340, 54]
  rooms_row_gap: 10
  rooms_rows: 7
  rooms_list_center_y: 365
  rooms_member_color: [40, 90, 140]
  rooms_other_color: [30, 30, 30]
  rooms_name_font_size: 24
  rooms_name_font_asset: 'assets/PublicSans-Medium.ttf'
  rooms_tag_font_size: 13
  rooms_tag_font_asset: 'assets/PublicSans-Bold.ttf'
  # Set main: tap it, then the room to make the main room (remembered in room_state.json)
  rooms_set_main_pos: [360, 103]     # centre, under the title
  rooms_set_main_size: [150, 40]
  rooms_set_main_font_size: 20
  rooms_set_main_font_asset: 'assets/PublicSans-Medium.ttf'
  rooms_failure_y: 606          # "Couldn't add ..." message, between the list and the down button
  rooms_pending_alpha: 110     # a room being added or removed is dimmed until the speakers report it
  # music service badge in the corner of each favorite's art (icons and short names under favorites.services)
  favs_service_badge_size: 30
  favs_service_badge_color: [20, 20, 20]
  favs_service_badge_font_size: 12
  favs_service_badge_font_asset: 'assets/PublicSans-Bold.ttf'


deck:
  play_button_asset: 'assets/PlayBtn.png'
  pause_button_asset: 'assets/PauseBtn.png'
  next_button_asset: 'assets/NextTrackBtn.png'
  prev_button_asset: 'assets/PrevTrackBtn.png'
  vol_up_button_asset: 'assets/VolUpBtn.png'
  vol_down_button_asset: 'assets/VolDownBtn.png'
favorites:
  # how a tapped favorite is started. local: soco clears the queue and adds the favorite (the speaker fetches the
  # whole playlist first, so long ones can take a while). cloud: one call to the Sonos cloud, like the Sonos app;
  # needs internet and a one-time `uv run sonos_auth.py`. Falls back to local if that sign-in is missing.
  load_via: cloud
  # music library genres (as tagged in your files) that get a tile after the line-in one; each tap queues a fresh
  # random pick of up to genre_max_tracks of the genre's tracks, so big genres don't build a huge queue
  genres: ['Chill', 'Synthpop', 'Alternative', 'Punk', 'IDM', 'Techno & House', 'Ambient']
  genre_max_tracks: 200
  # tile art: a folder per genre in genre_image_dir holding PNGs or JPGs, one picked at random each time the
  # favorites screen opens; initials if the folder is missing or empty. The folder is named after the genre,
  # unless genre_folders maps it to another name (for genres with awkward characters)
  genre_image_dir: 'assets/genres'
  genre_folders:
    'Techno & House': 'Techno'
  # artists from the music library (by track artist, so their compilation tracks count too) that get a tile after
  # the genres; same idea, with their own track limit. Art: a folder per artist like the genres, else one of
  # the artist's album covers from the library
  artists: ['New Order', 'Joy Division', 'Depeche Mode', 'Boards of Canada', 'Fugazi']
  artist_max_tracks: 200
  artist_image_dir: 'assets/artists'
  artist_folders: {}
  # services whose favorites go at the end of the grid, after the library and saved Sonos playlists
  sort_last: [204]      # Apple Music: its playlists load slowly or fail
  # each favorite tile gets a badge for its music service, keyed by the service id in the favorite's link
  # (204 = Apple Music, 12 = Spotify, 157 = Bandcamp; the log lists them at startup).
  # icon: a PNG to show; if the file is missing, a round badge with `short` (or the name's initials) is drawn.
  # Apple Music playlists load unreliably on the speakers (can take 20s and fail); the Sonos app plays them fine.
  services:
    204: {short: 'AM', icon: 'assets/AppleMusic.png'}
    12: {short: 'SP', icon: 'assets/Spotify.png'}
    157: {short: 'BC', icon: 'assets/BandCamp.png'}
    160: {short: 'SC', icon: 'assets/SoundCloud.png'}
    303: {short: 'SR', icon: 'assets/Sonos.png'}    # Sonos Radio
  # favorites from the music library on a network (SMB) share, saved Sonos playlists, and services not listed above
  library_icon: 'assets/Network.png'
  sonos_playlist_icon: 'assets/Sonos.png'
  unknown_service_icon: 'assets/UnknownService.png'

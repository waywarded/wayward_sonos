  prev_button_asset: "assets/PrevTrackBtn.png"
  next_button_size: [30, 30]
  prev_button_size: [30, 30]

  # bottom row, left to right: shuffle, favorites, play/pause, volume, group. pos is the top-left corner;
  # the outer pairs follow the curve of the circle, play sits level with its neighbours
  play_button_pos: [330, 634]
  play_button_asset: "assets/PlayBtn.png"
  play_button_size: [60, 60]
  pause_button_asset: "assets/PauseBtn.png"

  favs_button_pos: [263, 649]
  favs_button_size: [30, 30]
  favs_button_asset: "assets/FavsBtn.png"

  group_button_pos: [503, 618]
  group_button_size: [30, 30]
  group_button_asset: "assets/SpeakerGroup.png"

  # bright when shuffle is on, dim when off; hidden for line-in
  shuffle_button_pos: [188, 618]
  shuffle_button_size: [30, 30]
  shuffle_button_asset: "assets/ShuffleBtn.png"
  shuffle_off_alpha: 90

  # press and hold for the volume dial
  volume_button_pos: [427, 649]
  volume_button_size: [30, 30]
  volume_button_asset: "assets/VolBtn.png"

  # favorites screen
  favs_slide_time: 0.3
  favs_back_button_pos: [340, 640]
  favs_back_button_size: [40,40]
  favs_back_button_asset: "assets/DownBtn.png"
  favs_refresh_button_pos: [425, 45]
  favs_refresh_button_size: [30, 30]
  favs_refresh_button_asset: "assets/RefreshBtn.png"
  favs_tile_size: 120
  favs_label_font_size: 16
  favs_label_font_asset: 'assets/PublicSans-Medium.ttf'
  # rooms screen (the group button): a row per speaker, filled when grouped with the main room
  rooms_row_size: [340, 54]
  rooms_row_gap: 10
  rooms_rows: 7
  rooms_list_center_y: 365
  rooms_member_color: [40, 90, 140]
  rooms_other_color: [30, 30, 30]
  rooms_name_font_size: 24
  rooms_name_font_asset: 'assets/PublicSans-Medium.ttf'
  rooms_tag_font_size: 13
  rooms_tag_font_asset: 'assets/PublicSans-Bold.ttf'
  # Set main: tap it, then the room to make the main room (remembered in room_state.json)
  rooms_set_main_pos: [360, 103]     # centre, under the title
  rooms_set_main_size: [150, 40]
  rooms_set_main_font_size: 20
  rooms_set_main_font_asset: 'assets/PublicSans-Medium.ttf'
  rooms_failure_y: 606          # "Couldn't add ..." message, between the list and the down button
  rooms_pending_alpha: 110     # a room being added or removed is dimmed until the speakers report it
  # music service badge in the corner of each favorite's art (icons and short names under favorites.services)
  favs_service_badge_size: 30
  favs_service_badge_color: [20, 20, 20]
  favs_service_badge_font_size: 12
  favs_service_badge_font_asset: 'assets/PublicSans-Bold.ttf'


deck:
  play_button_asset: 'assets/PlayBtn.png'
  pause_button_asset: 'assets/PauseBtn.png'
  next_button_asset: 'assets/NextTrackBtn.png'
  prev_button_asset: 'assets/PrevTrackBtn.png'
  vol_up_button_asset: 'assets/VolUpBtn.png'
  vol_down_button_asset: 'assets/VolDownBtn.png'
favorites:
  # how a tapped favorite is started. local: soco clears the queue and adds the favorite (the speaker fetches the
  # whole playlist first, so long ones can take a while). cloud: one call to the Sonos cloud, like the Sonos app;
  # needs internet and a one-time `uv run sonos_auth.py`. Falls back to local if that sign-in is missing.
  load_via: cloud
  # services whose favorites go at the end of the grid, after the library and saved Sonos playlists
  sort_last: [204]      # Apple Music: its playlists load slowly or fail
  # each favorite tile gets a badge for its music service, keyed by the service id in the favorite's link
  # (204 = Apple Music, 12 = Spotify, 157 = Bandcamp; the log lists them at startup).
  # icon: a PNG to show; if the file is missing, a round badge with `short` (or the name's initials) is drawn.
  # Apple Music playlists load unreliably on the speakers (can take 20s and fail); the Sonos app plays them fine.
  services:
    204: {short: 'AM', icon: 'assets/AppleMusic.png'}
    12: {short: 'SP', icon: 'assets/Spotify.png'}
    157: {short: 'BC', icon: 'assets/BandCamp.png'}
    160: {short: 'SC', icon: 'assets/SoundCloud.png'}
    303: {short: 'SR', icon: 'assets/Sonos.png'}    # Sonos Radio
  # favorites from the music library on a network (SMB) share, saved Sonos playlists, and services not listed above
  library_icon: 'assets/Network.png'
  sonos_playlist_icon: 'assets/Sonos.png'
  unknown_service_icon: 'assets/UnknownService.png'

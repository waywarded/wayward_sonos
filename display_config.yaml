  volume_dial_width: 28
  volume_dial_font_size: 120
  volume_dial_font_asset: 'assets/PublicSans-Bold.ttf'
  volume_dial_label_font_size: 22
  volume_dial_label_font_asset: 'assets/PublicSans-Medium.ttf'


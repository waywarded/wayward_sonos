  artist_strip_parens: true

  album_font_size: 28
  album_font_asset: 'assets/PublicSans-MediumItalic.ttf'
  album_text_y: 598
  album_text_width: 480
  album_text_color: [255,255,255]
  album_text_alpha: 255
  album_text_shadow: true
  album_strip_parens: true

  speaker_font_size: 14

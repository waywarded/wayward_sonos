display:
  screen_size: 720
  fallback_font_size: 24
  background_image: "assets/background01.png"
  text_color: [255, 255, 255]
  text_shadow_color: [0, 0, 0]
  text_shadow_offset: [2, 2]
  line_in_track_image: "assets/lineIn02.png"
  line_in_track_name: "Record Player"


layout:
  track_font_size: 42
  track_text_color: [255,255,255]
  track_text_alpha: 255
  track_font_asset: "assets/PublicSans-Bold.ttf"
  track_text_y: 120
  track_text_width: 480
  track_text_shadow: true
  track_strip_parens: true
  track_line_space: -5

  artist_font_size: 28
  artist_font_asset: 'assets/PublicSans-Medium.ttf'
  artist_text_y: 575
  artist_text_width: 480
  artist_text_color: [255,255,255]
  artist_text_alpha: 255
  artist_text_shadow: true
  artist_strip_parens: true

  album_font_size: 28
  album_font_asset: 'assets/PublicSans-MediumItalic.ttf'
  album_text_y: 610
  album_text_width: 480
  album_text_color: [255,255,255]
  album_text_alpha: 255
  album_text_shadow: true
  album_strip_parens: true

  speaker_font_size: 14
  speaker_font_asset: 'assets/PublicSans-Medium.ttf'
  speaker_text_y: 50
  speaker_text_width: 300
  speaker_text_color: [255,255,255]
  speaker_text_alpha: 120
  speaker_text_shadow: true
  speaker_strip_parens: false

  status_font_size: 12
  status_font_asset: 'assets/PublicSans-Medium.ttf'
  status_text_y: 690
  status_text_width: 360
  status_text_color: [255,255,255]
  status_text_alpha: 180
  status_text_shadow: true
  status_strip_parens: false

  album_art_size: 360
  album_art_y: 360

  ui_header_font_size: 24
  ui_header_font_asset: 'assets/PublicSans-Bold.ttf'

  play_state_y: 520

  # extra tap area around small buttons (art size unchanged)
  button_hit_padding: 20

  # press and hold here (above the song title, around the room name) to get the quit confirm: [x, y, w, h]
  quit_hold_area: [200, 10, 320, 85]
  quit_hold_time: 1.5

  next_button_pos: [650, 320]
  prev_button_pos: [50, 320]
  next_button_asset: "assets/NextTrackBtn.png"
  prev_button_asset: "assets/PrevTrackBtn.png"
  next_button_size: [30, 30]
  prev_button_size: [30, 30]

  play_button_pos: [340, 640]
  play_button_asset: "assets/PlayBtn.png"
  play_button_size: [45, 45]
  pause_button_asset: "assets/PauseBtn.png"

  favs_button_pos: [230, 645]
  favs_button_size: [30, 30]
  favs_button_asset: "assets/FavsBtn.png"

  # disabled until the volume control exists
  volume_button_pos: [450, 645]
  volume_button_size: [30, 30]
  volume_button_asset: "assets/VolBtn.png"

  # favorites screen
  favs_slide_time: 0.3
  favs_back_button_pos: [340, 640]
  favs_back_button_size: [40,40]
  favs_back_button_asset: "assets/DownBtn.png"
  favs_refresh_button_pos: [425, 45]
  favs_refresh_button_size: [30, 30]
  favs_refresh_button_asset: "assets/RefreshBtn.png"
  favs_tile_size: 120
  favs_label_font_size: 16
  favs_label_font_asset: 'assets/PublicSans-Medium.ttf'


deck:
  play_button_asset: 'assets/PlayBtn.png'
  pause_button_asset: 'assets/PauseBtn.png'
  next_button_asset: 'assets/NextTrackBtn.png'
  prev_button_asset: 'assets/PrevTrackBtn.png'
  vol_up_button_asset: 'assets/VolUpBtn.png'
  vol_down_button_asset: 'assets/VolDownBtn.png'
